name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      # This is the intentional public debugging branch for the first Wafer
      # development cycle. Main remains the production source.
      - agent/wafer-foundation
  workflow_dispatch:

permissions: {}

concurrency:
  # GitHub Pages has one published environment. Development-branch pushes
  # temporarily replace the main deployment until main is deployed again.
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'oleksandrmaslov/zmk-studio'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /zmk-studio/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.repository == 'oleksandrmaslov/zmk-studio'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
