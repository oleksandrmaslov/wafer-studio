name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      # This is the intentional public debugging branch for the first Wafer
      # development cycle. Main remains the production source.
      - agent/wafer-foundation
  workflow_dispatch:

permissions: {}

concurrency:
  # GitHub Pages has one published environment. Development-branch pushes
  # temporarily replace the main deployment until main is deployed again.
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Guard on the owner, not the full repository name. A repository rename
    # used to silently disable this whole workflow: the job condition still
    # named the old repository, so every push simply skipped and the site went
    # stale with no failure anywhere to notice.
    if: github.repository_owner == 'oleksandrmaslov'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project pages are served from /<repo>/, so the asset base has to match
      # the repository name. Deriving it here rather than hard-coding it means
      # the next rename moves the site instead of breaking every asset URL.
      - name: Resolve Pages base path
        id: base
        run: echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.repository_owner == 'oleksandrmaslov'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
