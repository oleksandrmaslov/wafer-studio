# Builds the desktop app on every platform and collects the results into a
# single DRAFT GitHub release.
#
# Why this exists alongside `tauri-build.yml`: that workflow builds on push and
# only uploads to a release that *already exists*, which means publishing has to
# happen before anything has been compiled. This one goes the other way round —
# it creates the draft first, every platform uploads into it, and a human
# presses publish once the artifacts are actually there and tested.
#
# Tauri does not cross-compile. A .dmg requires macOS, a .deb requires Linux, an
# .msi requires Windows; there is no combination of flags that produces all
# three from one machine. A runner matrix is not a convenience here, it is the
# only way to get a full set.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v0.3.2'
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # One job, before the matrix, so four runners cannot race to create the same
  # release. Everything downstream uploads into the id this returns.
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;

            // Re-running a failed build should top up the existing draft rather
            // than fail on "tag already exists" or leave two drafts behind.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`Reusing existing release ${existing.id} for ${tag}.`);
              return String(existing.id);
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Wafer Studio ${tag}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
              body: [
                '## Wafer Studio',
                '',
                'Desktop builds for Windows, macOS and Linux.',
                '',
                'The desktop app exists for one reason the browser cannot cover:',
                'browsers only expose Web Bluetooth for this on Linux, so a wireless',
                'keyboard needs this build on Windows and macOS. Over USB, the web',
                'version does everything this one does.',
                '',
                '> These builds are unsigned. Windows SmartScreen and macOS Gatekeeper',
                '> will warn on first run.',
              ].join('\n'),
            });
            core.info(`Created draft release ${data.id} for ${tag}.`);
            return String(data.id);

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal, so one download covers both Apple Silicon and Intel.
          - platform: "macos-latest"
            name: macos
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-24.04"
            name: linux
            args: ""
          - platform: "windows-latest"
            name: windows
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libudev-dev patchelf \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      # No Azure Trusted Signing and no Apple notarisation here, deliberately:
      # both need credentials tied to an organisation, and a fork that does not
      # have them should still be able to cut a working release. The installers
      # are unsigned, which the release notes say out loud.
      - uses: tauri-apps/tauri-action@v0
        name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: keep the raw bundles too
        uses: actions/upload-artifact@v4
        with:
          name: wafer-studio-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
